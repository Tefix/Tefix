<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Tefix — Roman Zaitsev</title>
  <desc id="desc">A dark blue profile banner with an illuminated route across a wireframe globe.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#10172e"/>
      <stop offset="1" stop-color="#0c1023"/>
    </linearGradient>
    <radialGradient id="light">
      <stop stop-color="#393486" stop-opacity=".85"/>
      <stop offset="1" stop-color="#171a3a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="route" x2="1" y2="1">
      <stop stop-color="#5eead4"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#a5b4fc" stroke-opacity=".10"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="380" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="url(#background)"/>
    <ellipse cx="951" cy="188" rx="409" ry="303" fill="url(#light)"/>
    <rect x="640" width="560" height="380" fill="url(#grid)"/>
    <path d="M58 60h36" fill="none" stroke="#5eead4" stroke-width="3" stroke-linecap="round"/>

    <g font-family="Consolas, Menlo, monospace">
      <text x="58" y="103" fill="#9ce8de" font-size="20" letter-spacing="3">TEFIX / DEVELOPER PROFILE</text>
      <text x="58" y="293" fill="#a5b4fc" font-size="20" letter-spacing="2">WEB  /  MAPS  /  AUTOMATION</text>
    </g>
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
      <text x="54" y="200" fill="#f8fafc" font-size="86" font-weight="700" letter-spacing="-4">Roman Zaitsev</text>
      <text x="59" y="244" fill="#ccd5ed" font-size="27">Student developer</text>
    </g>

    <g transform="translate(935 190)">
      <circle r="159" fill="none" stroke="#929dff" stroke-opacity=".25" stroke-dasharray="3 10"/>
      <circle r="128" fill="#7279db" fill-opacity=".10" stroke="#a3a9ff" stroke-width="1.5" stroke-opacity=".72"/>
      <g fill="none" stroke="#a3a9ff" stroke-opacity=".43" stroke-width="1.5">
        <ellipse rx="94" ry="128"/>
        <ellipse rx="49" ry="128"/>
        <ellipse rx="128" ry="47"/>
        <path d="M-128 0H128 M0-128V128 M-111-64Q0-9 111-64 M-111 64Q0 9 111 64"/>
      </g>
      <path d="M-89 63C-72 24-53 26-29 12S-3-35 28-38 67-24 87-79"
        fill="none" stroke="#67e8f9" stroke-opacity=".15" stroke-width="14" stroke-linecap="round"/>
      <path d="M-89 63C-72 24-53 26-29 12S-3-35 28-38 67-24 87-79"
        fill="none" stroke="url(#route)" stroke-width="4" stroke-linecap="round"/>
      <circle cx="-89" cy="63" r="7" fill="#5eead4" stroke="#151b36" stroke-width="2"/>
      <circle cx="87" cy="-79" r="7" fill="#c4b5fd" stroke="#151b36" stroke-width="2"/>
      <circle cx="28" cy="-38" r="3.5" fill="#e0e7ff"/>
    </g>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="378.5" rx="27.25" fill="none" stroke="#7779a7" stroke-opacity=".55" stroke-width="1.5"/>
</svg>
